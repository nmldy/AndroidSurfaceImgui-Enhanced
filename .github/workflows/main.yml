name: Unzip and Commit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip
        run: unzip -o '*.zip' -d /tmp/extract

      - name: Move contents to repo root
        run: |
          rsync -a /tmp/extract/ ./
          rm -rf /tmp/extract

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract zip to repo root" || echo "No changes"
          git push
